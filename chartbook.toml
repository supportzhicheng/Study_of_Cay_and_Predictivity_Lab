[project]
type = "pipeline"
id = "finm329/cay-replication-lab"
name = "CAY Replication and Predictivity Lab"
description = "Replication, updated evidence, and extension diagnostics for the consumption-wealth trend deviation."
maintainer = "Zhicheng Zhou"
contributors = ["Iris Wang", "Zhicheng Zhou"]
repo_url = ""
readme = "./README.md"
copyright = "2026"
os_compatibility = ["Windows", "Linux", "MacOS"]
build = "doit compile_report"
enable_data_download = false

[notebooks]

[notebooks.replication_tour]
name = "CAY Replication Tour"
description = "Executed inspection notebook for the processed quarterly panel, generated report artifacts, and replication audit."
path = "_output/01_cay_replication_tour.ipynb"

[dataframes]

[dataframes.core_quarterly]
name = "Core Quarterly CAY Panel"
description = "Processed quarterly panel containing macroeconomic inputs, market returns, predictors, and historical replication fields."
sources = ["BEA NIPA", "Federal Reserve Z.1", "FRED", "Shiller", "WRDS/CRSP"]
providers = ["BEA", "Federal Reserve", "FRED", "Yale", "WRDS"]
provider_links = ["https://apps.bea.gov/", "https://www.federalreserve.gov/releases/z1/", "https://fred.stlouisfed.org/", "https://www.econ.yale.edu/~shiller/data.htm", "https://wrds-www.wharton.upenn.edu/"]
tags = ["CAY", "Macroeconomics", "Asset Pricing", "Quarterly"]
pull_method = "Root doit workflow: core_acquire, core_prepare, and build_panel"
path = "_data/processed/core_quarterly.parquet"
docs = "The core panel is the canonical quarterly dataset used for all historical replication and updated CAY exhibits. It is generated by the root workflow and is not tracked by Git."

[dataframes.extension_panel]
name = "Regional Extension Predictivity Panel"
description = "Processed regional-proxy panel with sub-CAY component predictors and forward target growth."
sources = ["Federal Reserve Z.1", "FRED state series"]
providers = ["Federal Reserve", "FRED"]
provider_links = ["https://www.federalreserve.gov/releases/z1/", "https://fred.stlouisfed.org/"]
tags = ["CAY", "Regional", "Predictivity", "Quarterly"]
pull_method = "Root doit workflow: extension_acquire, extension_prepare, and extension_analyze"
path = "_data/processed/extension/extension_panel.parquet"
docs = "The extension panel contains California, Illinois, and Texas proxy components. Liquid wealth uses the documented income-share fallback."

[charts]

[charts.historical_cay_returns]
name = "Historical CAY and Excess Returns"
description = "Historical standardized CAY and excess-return figure used in the replication section."
dataframe = "core_quarterly"
tags = ["CAY", "Historical Replication", "Returns"]
frequency = "Quarterly"
observation_period = "1952Q4--1998Q3"
release_lag = "Generated after core panel construction"
release_timing = "On workflow execution"
units = "Standardized log-level deviation and return"
path = "reports/figures/figure_1_replication.png"
docs = "Authors' calculation benchmarked to Lettau and Ludvigson (2001) Figure 1. Formal predictivity is evaluated in generated regression tables."

[charts.updated_cay_returns]
name = "Updated CAY and Excess Returns"
description = "Updated standardized CAY and excess-return figure using the latest common sample."
dataframe = "core_quarterly"
tags = ["CAY", "Updated Evidence", "Returns"]
frequency = "Quarterly"
observation_period = "Latest common sample"
release_lag = "Generated after core panel construction"
release_timing = "On workflow execution"
units = "Standardized log-level deviation and return"
path = "reports/figures/figure_1_updated.png"
docs = "Updated evidence uses the same documented specification with current source vintages."

[charts.data_anatomy]
name = "Consumption, Income, and Wealth Anatomy"
description = "Indexed levels and growth diagnostics for the three CAY inputs."
dataframe = "core_quarterly"
tags = ["CAY", "Macroeconomics", "Data Diagnostics"]
frequency = "Quarterly"
observation_period = "Latest common sample"
release_lag = "Generated after core panel construction"
release_timing = "On workflow execution"
units = "Indexed levels and growth rates"
path = "reports/figures/figure_s1_data_anatomy.png"
docs = "The figure distinguishes shared long-run movement from short-run divergence in consumption, labor income, and wealth."
